name: Pipeline

on: 
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Show branch
        run: echo "Branch is ${{ github.ref }}"

      - name: Show repository
        run: echo "Repository is ${{ github.repository }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check node version
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build angular app
        run: npm run build

      - name: check build output
        run: ls -R dist

      - name: Login to GHCR 
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest \
          -t ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }} \
          .

      - name: Check Docker image
        run: docker images

      - name: Push Docker Image 
        run: | 
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest 
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

      - name: Run docker container
        run: | 
          docker run -d --name edm-angular -p 8080:80 ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      - name: Check Container
        run: docker ps -a

      - name: Check Container Logs
        run: docker logs edm-angular
    
      - name: Test Website
        run: |
          sleep 5
          curl -v http://localhost:8080

